<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Booking | Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header"></header>

  <div class="container">
    <div class="auth-card">
      <h2>Is-diiwaangeli</h2>
      <div class="field">
        <label for="name">Magaca oo dhan</label>
        <input type="text" id="name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password (ugu yaraan 6)</label>
        <input type="password" id="password">
      </div>
      <div class="field">
        <label for="password2">Ku celi password</label>
        <input type="password" id="password2">
      </div>
      <p class="error" id="error"></p>
      <button class="btn btn-block" id="regBtn">Samee akoon</button>
      <p class="auth-switch">Akoon hore ma leedahay? <a href="login.html"><u>Gal</u></a></p>
    </div>
  </div>

  <footer id="footer"></footer>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    if (Auth.current()) location.href = "index.html";

    document.getElementById("regBtn").addEventListener("click", () => {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const p1 = document.getElementById("password").value;
      const p2 = document.getElementById("password2").value;
      const error = document.getElementById("error");

      if (!name || !email || !p1) { error.textContent = "Buuxi dhammaan meelaha."; return; }
      if (!/^\S+@\S+\.\S+$/.test(email)) { error.textContent = "Email-ku sax ma aha."; return; }
      if (p1.length < 6) { error.textContent = "Password-ku waa inuu ugu yaraan 6 xaraf yahay."; return; }
      if (p1 !== p2) { error.textContent = "Labada password isma laha."; return; }

      const res = Auth.register(name, email, p1);
      if (res.error) { error.textContent = res.error; return; }
      location.href = "index.html";
    });
  </script>
</body>
</html>
